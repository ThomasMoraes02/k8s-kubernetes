apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: goserver-ingress
spec:
  ingressClassName: nginx
  rules:
    - host: goserver.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: goserver-service
                port:
                  number: 80
