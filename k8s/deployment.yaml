apiVersion: apps/v1
kind: Deployment
metadata:
  name: goserver
  labels:
    app: goserver
spec:
  selector:
    matchLabels:
      app: goserver
  replicas: 1
  template:
    metadata:
      labels:
        app: "goserver"
    spec:
      containers:
      - name: goserver
        image: "thomasmoraes02/hello-go:v4"
        envFrom:
          - configMapRef:
              name: goserver-env

        # Alternativas
        # env:
        #   - name: NAME
        #     valueFrom:
        #       configMapKeyRef:
        #         name: goserver-env
        #         key: NAME

        #   # tem esse caminho
        #   - name: AGE
        #     value: "26"
        ports:
        - containerPort: 8080
